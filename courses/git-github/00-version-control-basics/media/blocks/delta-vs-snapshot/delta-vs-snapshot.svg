<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Delta chains compared with snapshots</title>
  <desc id="desc">A delta-based history stores one base file and a chain of changes. A Git history stores complete project snapshots at each commit and computes differences between snapshots on demand.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4a5a"/>
    </marker>
    <style>
      .panel { fill: #f7f9fc; stroke: #c9d3df; stroke-width: 2; rx: 16; }
      .title { font: 700 24px system-ui, sans-serif; fill: #13202e; }
      .label { font: 600 17px system-ui, sans-serif; fill: #13202e; }
      .note { font: 15px system-ui, sans-serif; fill: #526274; }
      .box { fill: #ffffff; stroke: #7d8fa3; stroke-width: 2; rx: 10; }
      .snap { fill: #e7f7ee; stroke: #2f8f5b; stroke-width: 2; rx: 12; }
      .delta { fill: #fff3dc; stroke: #b57912; stroke-width: 2; rx: 12; }
      .line { stroke: #3b4a5a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .tiny { font: 14px ui-monospace, monospace; fill: #526274; }
    </style>
  </defs>

  <rect class="panel" x="16" y="16" width="450" height="348"/>
  <text class="title" x="40" y="58">Delta-based history</text>
  <text class="note" x="40" y="86">Store a base version, then each change.</text>

  <rect class="box" x="40" y="120" width="112" height="68"/>
  <text class="label" x="60" y="150">Base file</text>
  <text class="tiny" x="60" y="172">version 1</text>

  <line class="line" x1="158" y1="154" x2="196" y2="154"/>
  <rect class="delta" x="202" y="120" width="84" height="68"/>
  <text class="label" x="218" y="150">Change</text>
  <text class="tiny" x="218" y="172">+ line</text>

  <line class="line" x1="292" y1="154" x2="330" y2="154"/>
  <rect class="delta" x="336" y="120" width="84" height="68"/>
  <text class="label" x="352" y="150">Change</text>
  <text class="tiny" x="352" y="172">- line</text>

  <text class="note" x="40" y="240">To read version 3, start at the base</text>
  <text class="note" x="40" y="264">and apply every change in order.</text>
  <text class="tiny" x="40" y="310">base + patch 2 + patch 3 = version 3</text>

  <rect class="panel" x="494" y="16" width="450" height="348"/>
  <text class="title" x="518" y="58">Snapshot history</text>
  <text class="note" x="518" y="86">Store the whole project at each commit.</text>

  <rect class="snap" x="518" y="120" width="92" height="68"/>
  <text class="label" x="538" y="150">Commit 1</text>
  <text class="tiny" x="538" y="172">version 1</text>

  <line class="line" x1="616" y1="154" x2="650" y2="154"/>
  <rect class="snap" x="656" y="120" width="92" height="68"/>
  <text class="label" x="676" y="150">Commit 2</text>
  <text class="tiny" x="676" y="172">version 2</text>

  <line class="line" x1="754" y1="154" x2="788" y2="154"/>
  <rect class="snap" x="794" y="120" width="92" height="68"/>
  <text class="label" x="814" y="150">Commit 3</text>
  <text class="tiny" x="814" y="172">version 3</text>

  <text class="note" x="518" y="240">Any commit can be read directly.</text>
  <text class="note" x="518" y="264">A diff is calculated between snapshots.</text>
  <text class="tiny" x="518" y="310">commit 3 - commit 2 = the change</text>
</svg>
