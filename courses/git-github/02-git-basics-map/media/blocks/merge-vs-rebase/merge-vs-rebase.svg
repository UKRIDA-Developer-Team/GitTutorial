<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Merge compared with rebase</title>
  <desc id="desc">Merge joins main and feature with a merge commit that has two parents. Rebase copies the feature commits onto the tip of main, producing new commits in a straight line.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
      .sub { font: 15px system-ui, sans-serif; fill: #475569; }
      .commit { fill: #ffffff; stroke: #2f6fb3; stroke-width: 2.5; }
      .new { fill: #fff7e6; stroke: #b57912; stroke-width: 2.5; }
      .merge { fill: #eaf8ef; stroke: #2f8f5b; stroke-width: 2.5; }
      .hash { font: 600 14px ui-monospace, monospace; fill: #0f172a; }
      .label { font: 700 14px system-ui, sans-serif; fill: #0f172a; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .branch { fill: #eef6ff; stroke: #2f6fb3; stroke-width: 1.5; rx: 6; }
      .tag { fill: #eaf8ef; stroke: #2f8f5b; stroke-width: 1.5; rx: 6; }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="440" height="440" rx="16"/>
  <text class="title" x="44" y="58">Merge</text>
  <text class="sub" x="44" y="84">Keep both histories, then join them.</text>

  <circle class="commit" cx="80" cy="260" r="24"/>
  <text class="hash" x="72" y="266">A</text>
  <circle class="commit" cx="182" cy="260" r="24"/>
  <text class="hash" x="174" y="266">B</text>
  <circle class="commit" cx="284" cy="260" r="24"/>
  <text class="hash" x="276" y="266">C</text>
  <circle class="merge" cx="386" cy="260" r="24"/>
  <text class="hash" x="378" y="266">M</text>

  <line class="line" x1="106" y1="260" x2="154" y2="260"/>
  <line class="line" x1="208" y1="260" x2="256" y2="260"/>

  <circle class="commit" cx="182" cy="150" r="24"/>
  <text class="hash" x="174" y="156">D</text>
  <circle class="commit" cx="284" cy="150" r="24"/>
  <text class="hash" x="276" y="156">E</text>
  <line class="line" x1="182" y1="236" x2="182" y2="178"/>
  <line class="line" x1="208" y1="150" x2="256" y2="150"/>
  <line class="line" x1="304" y1="164" x2="366" y2="236"/>

  <rect class="branch" x="344" y="330" width="84" height="30"/>
  <text class="label" x="360" y="350">main</text>
  <line x1="386" y1="328" x2="386" y2="288" stroke="#2f6fb3" stroke-width="2"/>

  <rect class="branch" x="248" y="96" width="84" height="30"/>
  <text class="label" x="262" y="116">feature</text>

  <text class="sub" x="48" y="408">M has two parents: C and E.</text>
  <text class="sub" x="48" y="432">The merge commit joins both lines.</text>

  <rect class="panel" x="500" y="20" width="440" height="440" rx="16"/>
  <text class="title" x="524" y="58">Rebase</text>
  <text class="sub" x="524" y="84">Replay feature commits on a new base.</text>

  <circle class="commit" cx="550" cy="260" r="24"/>
  <text class="hash" x="542" y="266">A</text>
  <circle class="commit" cx="642" cy="260" r="24"/>
  <text class="hash" x="634" y="266">B</text>
  <circle class="commit" cx="734" cy="260" r="24"/>
  <text class="hash" x="726" y="266">C</text>

  <line class="line" x1="576" y1="260" x2="614" y2="260"/>
  <line class="line" x1="668" y1="260" x2="706" y2="260"/>

  <circle class="new" cx="826" cy="260" r="24"/>
  <text class="hash" x="814" y="266">D'</text>
  <circle class="new" cx="912" cy="260" r="24"/>
  <text class="hash" x="900" y="266">E'</text>
  <line class="line" x1="760" y1="260" x2="798" y2="260"/>
  <line class="line" x1="852" y1="260" x2="884" y2="260"/>

  <rect class="branch" x="694" y="330" width="84" height="30"/>
  <text class="label" x="710" y="350">main</text>
  <line x1="734" y1="328" x2="734" y2="288" stroke="#2f6fb3" stroke-width="2"/>

  <rect class="tag" x="850" y="160" width="84" height="30"/>
  <text class="label" x="864" y="180">feature</text>
  <line x1="912" y1="192" x2="912" y2="232" stroke="#2f8f5b" stroke-width="2"/>

  <text class="sub" x="524" y="408">D' and E' are new commits.</text>
  <text class="sub" x="524" y="432">The old D and E are no longer in this line.</text>
</svg>
