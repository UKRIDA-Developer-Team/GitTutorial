<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">The pull request lifecycle</title>
  <desc id="desc">A flow from branch to push to open pull request to review and checks to merge to sync. A loop labeled push more commits returns from review to push.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { stroke-width: 2; rx: 12; }
      .git { fill: #eef6ff; stroke: #2f6fb3; }
      .platform { fill: #eaf8ef; stroke: #2f8f5b; }
      .review { fill: #fff7e6; stroke: #b57912; }
      .sync { fill: #f8fafc; stroke: #94a3b8; }
      .title { font: 700 26px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px system-ui, sans-serif; fill: #475569; }
      .box-title { font: 700 16px system-ui, sans-serif; fill: #0f172a; }
      .note { font: 13px ui-monospace, monospace; fill: #0f172a; }
      .loop-label { font: 700 14px system-ui, sans-serif; fill: #475569; }
      .footer { font: 15px system-ui, sans-serif; fill: #475569; }
      .flow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 6 5; }
    </style>
  </defs>

  <text class="title" x="40" y="48">The pull request lifecycle</text>
  <text class="subtitle" x="40" y="78">A branch becomes a pull request, gathers review and checks, and merges into the base branch.</text>

  <rect class="box git" x="40" y="140" width="130" height="90"/>
  <text class="box-title" x="54" y="170">Branch</text>
  <text class="note" x="54" y="200">git switch -c</text>

  <rect class="box git" x="190" y="140" width="130" height="90"/>
  <text class="box-title" x="204" y="170">Push</text>
  <text class="note" x="204" y="200">git push -u</text>

  <rect class="box platform" x="340" y="140" width="130" height="90"/>
  <text class="box-title" x="354" y="170">Open PR</text>
  <text class="note" x="354" y="200">gh pr create</text>

  <rect class="box review" x="490" y="140" width="130" height="90"/>
  <text class="box-title" x="504" y="170">Review</text>
  <text class="note" x="504" y="196">comments</text>
  <text class="note" x="504" y="214">and checks</text>

  <rect class="box platform" x="640" y="140" width="130" height="90"/>
  <text class="box-title" x="654" y="170">Merge</text>
  <text class="note" x="654" y="200">gh pr merge</text>

  <rect class="box sync" x="790" y="140" width="130" height="90"/>
  <text class="box-title" x="804" y="170">Sync</text>
  <text class="note" x="804" y="200">git pull</text>

  <line class="flow" x1="170" y1="185" x2="188" y2="185"/>
  <line class="flow" x1="320" y1="185" x2="338" y2="185"/>
  <line class="flow" x1="470" y1="185" x2="488" y2="185"/>
  <line class="flow" x1="620" y1="185" x2="638" y2="185"/>
  <line class="flow" x1="770" y1="185" x2="788" y2="185"/>

  <path class="loop" d="M 555 140 L 555 110 L 255 110 L 255 138"/>
  <text class="loop-label" x="405" y="102" text-anchor="middle">push more commits</text>

  <text class="footer" x="40" y="285">The pull request tracks the branch, so new commits update the review automatically.</text>
</svg>
