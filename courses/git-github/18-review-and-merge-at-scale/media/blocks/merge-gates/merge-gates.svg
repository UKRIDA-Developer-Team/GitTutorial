<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Merge gates</title>
  <desc id="desc">A pull request passes through required review, required checks, and the merge queue before it reaches the protected base branch. A failure at any gate returns the pull request to the author for an update.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px system-ui, sans-serif; fill: #475569; }
      .box { stroke-width: 2; rx: 12; }
      .pr { fill: #eef6ff; stroke: #2f6fb3; }
      .gate { fill: #fff7e6; stroke: #b57912; }
      .queue { fill: #eaf8ef; stroke: #2f8f5b; }
      .base { fill: #eaf8ef; stroke: #2f8f5b; }
      .retry { fill: #f8fafc; stroke: #94a3b8; }
      .box-title { font: 700 16px system-ui, sans-serif; fill: #0f172a; }
      .box-note { font: 13px ui-monospace, monospace; fill: #334155; }
      .small { font: 13px system-ui, sans-serif; fill: #475569; }
      .flow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .back { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow-muted); stroke-dasharray: 7 5; }
      .label { font: 700 14px system-ui, sans-serif; fill: #475569; }
      .footer { font: 15px system-ui, sans-serif; fill: #475569; }
    </style>
  </defs>

  <text class="title" x="40" y="48">Merge gates</text>
  <text class="subtitle" x="40" y="78">A pull request must satisfy every gate before it reaches the protected base branch.</text>

  <rect class="box pr" x="40" y="150" width="150" height="100"/>
  <text class="box-title" x="60" y="184">Pull request</text>
  <text class="box-note" x="60" y="212">open, not draft</text>

  <rect class="box gate" x="230" y="150" width="150" height="100"/>
  <text class="box-title" x="250" y="184">Review</text>
  <text class="box-note" x="250" y="212">required approvals</text>
  <text class="small" x="250" y="234">CODEOWNERS</text>

  <rect class="box gate" x="420" y="150" width="150" height="100"/>
  <text class="box-title" x="440" y="184">Checks</text>
  <text class="box-note" x="440" y="212">required status</text>
  <text class="small" x="440" y="234">latest commit</text>

  <rect class="box queue" x="610" y="150" width="150" height="100"/>
  <text class="box-title" x="630" y="184">Queue</text>
  <text class="box-note" x="630" y="212">latest base</text>
  <text class="small" x="630" y="234">combined result</text>

  <rect class="box base" x="800" y="150" width="120" height="100"/>
  <text class="box-title" x="820" y="184">Base</text>
  <text class="box-note" x="820" y="212">main</text>

  <line class="flow" x1="190" y1="200" x2="228" y2="200"/>
  <line class="flow" x1="380" y1="200" x2="418" y2="200"/>
  <line class="flow" x1="570" y1="200" x2="608" y2="200"/>
  <line class="flow" x1="760" y1="200" x2="798" y2="200"/>

  <path class="back" d="M 305 250 L 305 320 L 145 320 L 145 252"/>
  <path class="back" d="M 495 250 L 495 320"/>
  <path class="back" d="M 685 250 L 685 320"/>

  <rect class="box retry" x="230" y="320" width="530" height="55"/>
  <text class="box-title" x="252" y="345">Any failure: author updates the branch</text>
  <text class="small" x="252" y="366">Checks and queue results rerun. The pull request does not skip a gate.</text>

  <text class="footer" x="40" y="410">A green check answers one question. The merge policy asks several.</text>
</svg>
